name: 🚀 Deploy ERP API (live-prod-server)
on:
  push:
    branches:
      - live-prod-server  # Production ERP API: deploys on push to live-prod

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./server/
        # Server-only files: never overwrite the production .env / config.php, and keep runtime data off git-deploy
        exclude: |
          **/.git*
          **/.env*
          config/config.php
          scratch/**
          logs/**
          public/uploads/**
          **/*.log
