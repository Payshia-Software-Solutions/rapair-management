name: 🚀 Deploy ERP API (live-prod-server)
on:
  push:
    branches:
      - live-prod-server  # Production ERP API: deploys on push to live-prod

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./server/
        # Server-only files: never overwrite the production .env / config.php, and keep runtime data off git-deploy
        exclude: |
          **/.git*
          **/.env*
          config/config.php
          scratch/**
          logs/**
          public/uploads/**
          **/*.log
          # Dumps and installer scripts stay off production (they hold data or DROP statements).
          # clean_database_template.sql is still deployed: the workspace provisioner needs it.
          database.sql
          database_new.sql
          repair_management_db_dump.sql
          seed_packages.sql
          storage/**
          # Ad-hoc debug, test and repair scripts never go live
          public/test_*
          public/debug_*
          public/check_*
          public/fix_*
          public/*_fix.php
          public/seed_*
          public/migrate_*
          public/scratch_*
