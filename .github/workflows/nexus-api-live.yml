name: 🚀 Deploy Nexus API (nexus-server-api-live)
on:
  push:
    branches:
      - nexus-server-api-live  # Production Nexus API: deploys on push to nexus-server-api-live

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.NEXUS_FTP_SERVER }}
        username: ${{ secrets.NEXUS_FTP_USERNAME }}
        password: ${{ secrets.NEXUS_FTP_PASSWORD }}
        local-dir: ./nexus-portal-server/
        # vendor/ is deployed on purpose (cPanel has no composer). Keep the production .env and scratch data off the deploy.
        exclude: |
          **/.git*
          **/.env*
          config/config.php
          scratch/**
          logs/**
          **/*.log
