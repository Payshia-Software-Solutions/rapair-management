name: mobile_mgmt
description: BizzFlow management app - dashboards and approvals for management officers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^19.4.0
  package_info_plus: ^9.0.1
  intl: ^0.20.2
  fl_chart: ^1.1.0
  local_auth: ^2.3.0
  mobile_scanner: ^7.2.0
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/splash_brand.png

# Icons: dart run flutter_launcher_icons   (sources in assets/branding, drawn by a one-off script)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 23

# Splash: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#4F46E5"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#4F46E5"
    image: assets/branding/splash_logo.png
    icon_background_color: "#4F46E5"
  ios: false
  web: false
  fullscreen: false
